# 项目模块与测试覆盖清单（累计缺口分析用）
# expectedLayers: api-e2e | browser-e2e
modules:
  - id: scaffold
    name: 脚手架 / 健康检查
    apiSuites: [app]
    expectedLayers: [api-e2e]

  - id: auth
    name: 认证
    apiSuites: [auth, member-auth]
    browserTags: ['@module:auth']
    adminPages:
      - { path: /auth/login, name: 登录页 }
    expectedLayers: [api-e2e, browser-e2e]

  - id: rbac
    name: RBAC（用户/角色/菜单）
    apiSuites: [rbac]
    adminPages:
      - { path: /system/user, name: 用户管理 }
      - { path: /system/role, name: 角色管理 }
      - { path: /system/menu, name: 菜单管理 }
    expectedLayers: [api-e2e, browser-e2e]

  - id: article
    name: 用户端文章示例 API
    apiSuites: [article]
    expectedLayers: [api-e2e]

  - id: audit
